<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial - {{ app_name }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body { background: #f5f5f5; padding: 20px; }
        .public-credencial { max-width: 400px; margin: 0 auto; }
    </style>
</head>
<body>
    <div class="public-credencial">
        <div class="credencial-card">
            <div class="credencial-header">
                <h2>🚨 {{ app_name }}</h2>
                <p>Credencial de Rescate Urbano</p>
            </div>

            <div class="credencial-content">
                <div class="credencial-avatar">👤</div>
                
                <div class="credencial-info">
                    <div class="info-row">
                        <span class="label">Nombre:</span>
                        <span class="value">{{ user.nombre_completo }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">ID TSAR-U:</span>
                        <span class="value">{{ user.id }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Cargo:</span>
                        <span class="value">{{ user.cargo if user.cargo else 'N/A' }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Rol:</span>
                        <span class="value">{{ user.rol }}</span>
                    </div>
                    <div class="info-row">
                        <span class="label">Especialidades:</span>
                        <span class="value">{{ user.especialidades if user.especialidades else 'N/A' }}</span>
                    </div>
                </div>
            </div>

            <div class="credencial-footer">
                <p>Credencial verificada</p>
            </div>
        </div>
    </div>
</body>
</html>
